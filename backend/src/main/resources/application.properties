spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/pantriful
spring.datasource.username=pantriful
spring.datasource.password=pantriful_dev_password

# Flyway migrations own the schema; Hibernate must not auto-create/alter tables,
# but it does validate entities against the real schema on startup.
spring.jpa.hibernate.ddl-auto=validate

# Google OAuth client IDs (public identifiers, safe to commit - not secrets).
google.oauth.web-client-id=738084053265-rh8s0phl80ti1h07ht2585cf8ej1m738.apps.googleusercontent.com
google.oauth.ios-client-id=738084053265-4u0snai9ubmjo3m7fc0mplkjp6md9pr6.apps.googleusercontent.com

# Secret key used to sign/verify our own JWTs. Must be set as a real environment
# variable - never commit an actual value here.
jwt.secret=${JWT_SECRET}
