spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/pantriful
spring.datasource.username=pantriful
spring.datasource.password=pantriful_dev_password

# Flyway migrations own the schema; Hibernate must not auto-create/alter tables,
# but it does validate entities against the real schema on startup.
spring.jpa.hibernate.ddl-auto=validate
